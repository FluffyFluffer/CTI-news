# Sources for the dashboard. Add a source = add a block here (or run: python cyber_dashboard.py add <url>).
#
# type: rss      -> direct feed URL
# type: auto     -> any page URL; the feed is discovered automatically
# type: sitemap  -> sitemap.xml; newest pages are read (optional: url_contains, limit)
# type: scrape   -> plain HTML; CSS selectors: item (required), title, link (default: "a")
# Optional on every source: limit (default 40), enabled (default true)

- name: BleepingComputer
  type: rss
  url: https://www.bleepingcomputer.com/feed/

- name: The Hacker News
  type: rss
  url: https://feeds.feedburner.com/TheHackersNews

